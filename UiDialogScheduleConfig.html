<!DOCTYPE html>
<html lang="es">
<head>
  <base target="_top">
  <meta charset="utf-8">
  <style><?!= uiThemeCss ?></style>
  <?!= includeUiFile_('UiStyles'); ?>
</head>
<body>
<main class="app">
  <header class="brand-header"><img class="brand-logo" src="<?!= branding.icon ?>" alt=""><div class="brand-copy"><p class="brand-name"><?= uiConfig.projectName ?></p><span class="version-label"><?= uiConfig.versionLabel ?></span></div></header>
  <? if (wizardStep) { ?><p class="wizard-progress">Paso <?= wizardStep ?> de 6 · <?= wizardStep === 3 ? 'Tramos horarios' : wizardStep === 4 ? 'Actividades' : 'Horario semanal' ?></p><p class="form-help">Los pasos guardados se conservan si cancelas. Atrás descarta los cambios de este paso aún no guardados.</p><? } ?>
  <form class="config-form" id="schedule-form">
    <div class="config-scroll">
      <div class="result" id="blocking-error" role="alert"></div>
      <section class="schedule-accordion" id="slots-section">
        <button class="schedule-accordion-toggle" type="button" data-action="toggle-section" data-section="slots" aria-expanded="false"><span class="calendar-accordion-indicator">&#9656;</span><span>Tramos horarios</span></button>
        <div class="schedule-accordion-panel is-hidden" id="slots-panel"><div id="slots-list"></div><div class="schedule-add-row"><button class="button button-secondary compact-button" type="button" data-action="add-slot">+ A&ntilde;adir tramo</button></div></div>
      </section>
      <section class="schedule-accordion" id="activities-section">
        <button class="schedule-accordion-toggle" type="button" data-action="toggle-section" data-section="activities" aria-expanded="false"><span class="calendar-accordion-indicator">&#9656;</span><span>Actividades</span></button>
        <div class="schedule-accordion-panel is-hidden" id="activities-panel"><div id="activities-list"></div><div class="schedule-add-row"><button class="button button-secondary compact-button" type="button" data-action="add-activity">+ A&ntilde;adir actividad</button></div></div>
      </section>
      <section class="schedule-accordion" id="weekly-section">
        <button class="schedule-accordion-toggle" type="button" data-action="toggle-section" data-section="weekly" aria-expanded="false"><span class="calendar-accordion-indicator">&#9656;</span><span>Horario semanal</span></button>
        <div class="schedule-accordion-panel is-hidden" id="weekly-panel"><div id="weekly-grid"></div></div>
      </section>
    </div>
    <div class="save-loading is-hidden" id="save-loading" role="status" aria-live="polite"><span class="loading-spinner" aria-hidden="true"></span><span>Guardando horario...</span></div>
    <div class="config-feedback"><div class="result" id="form-result" role="status"></div><div class="actions"><button class="button button-secondary" id="close-button" type="button">Cancelar</button><? if (wizardStep) { ?><button class="button button-secondary" id="back-button" type="button">Atrás</button><? } ?><button class="button" id="save-button" type="submit" disabled><?= wizardStep ? 'Siguiente' : 'Guardar' ?></button></div></div>
  </form>
  <div class="internal-confirmation-backdrop is-hidden" id="confirmation-overlay" aria-hidden="true">
    <section class="internal-confirmation" role="alertdialog" aria-modal="true" aria-labelledby="confirmation-title" aria-describedby="confirmation-message">
      <h2 id="confirmation-title"></h2>
      <p id="confirmation-message"></p>
      <div class="actions"><button class="button button-secondary" id="confirmation-cancel" type="button">Cancelar</button><button class="button button-danger" id="confirmation-accept" type="button">Eliminar</button></div>
    </section>
  </div>
  <footer class="author-footer">&copy; <?= uiConfig.author ?> &middot; <a href="mailto:<?= uiConfig.authorEmail ?>"><?= uiConfig.authorEmail ?></a></footer>
</main>
<script>
  const WIZARD_STEP = <?!= JSON.stringify(wizardStep) ?>;
  const INITIAL_SCHEDULE_CONFIG = <?!= JSON.stringify(scheduleConfig) ?>;
  const form = document.getElementById('schedule-form');
  const slotsList = document.getElementById('slots-list');
  const activitiesList = document.getElementById('activities-list');
  const weeklyGrid = document.getElementById('weekly-grid');
  const closeButton = document.getElementById('close-button');
  const saveButton = document.getElementById('save-button');
  const resultElement = document.getElementById('form-result');
  const blockingErrorElement = document.getElementById('blocking-error');
  const saveLoading = document.getElementById('save-loading');
  const confirmationOverlay = document.getElementById('confirmation-overlay');
  const confirmationTitle = document.getElementById('confirmation-title');
  const confirmationMessage = document.getElementById('confirmation-message');
  const confirmationCancel = document.getElementById('confirmation-cancel');
  const confirmationAccept = document.getElementById('confirmation-accept');
  let data = clone(INITIAL_SCHEDULE_CONFIG);
  let baseline = '';
  let isSaving = false;
  let pendingConfirmation = null;
  const expandedSections = { slots: WIZARD_STEP === 3, activities: WIZARD_STEP === 4, weekly: WIZARD_STEP === 5 };
  const expandedActivities = {};
  const isBlocked = Boolean(data.blockingError);

  if (isBlocked) { blockingErrorElement.textContent = data.blockingError; blockingErrorElement.className = 'result visible error'; }
  sortSlotsChronologically();
  normalizeSlotChain();
  renderAll();
  baseline = serialize();
  updateSaveButton();
  form.addEventListener('input', handleFieldChange);
  form.addEventListener('change', handleFieldChange);
  form.addEventListener('click', handleAction);
  form.addEventListener('submit', function(event) {
    event.preventDefault();
    if (isBlocked || isSaving) return;
    if (WIZARD_STEP && !isDirty()) {
      google.script.run.withFailureHandler(handleSaveError).abrirPasoAsistenteCurso(WIZARD_STEP + 1);
      return;
    }
    if (!isDirty() || !form.reportValidity()) return;
    const validationError = validateSlots();
    if (validationError) { showResult(validationError, 'error'); return; }
    setSavingState(true);
    hideResult();
    google.script.run.withSuccessHandler(function() {
      if (WIZARD_STEP) google.script.run.withFailureHandler(handleSaveError).abrirPasoAsistenteCurso(WIZARD_STEP + 1);
      else google.script.host.close();
    }).withFailureHandler(handleSaveError).guardarConfiguracionHorario(getPayload());
  });
  closeButton.addEventListener('click', function() { google.script.host.close(); });
  if (WIZARD_STEP) document.getElementById('back-button').addEventListener('click', function() {
    google.script.run.withFailureHandler(handleSaveError).abrirPasoAsistenteCurso(WIZARD_STEP - 1);
  });
  confirmationCancel.addEventListener('click', closeConfirmation);
  confirmationAccept.addEventListener('click', acceptConfirmation);
  confirmationOverlay.addEventListener('click', function(event) { if (event.target === confirmationOverlay) closeConfirmation(); });
  document.addEventListener('keydown', function(event) { if (event.key === 'Escape' && pendingConfirmation) closeConfirmation(); });

  function renderAll() { renderSections(); renderSlots(); renderActivities(); renderWeeklyGrid(); if (WIZARD_STEP) ['slots', 'activities', 'weekly'].forEach(function(section) { document.getElementById(section + '-section').classList.toggle('is-hidden', section !== ({3:'slots',4:'activities',5:'weekly'})[WIZARD_STEP]); }); if (isBlocked) form.querySelectorAll('input, select, button').forEach(function(control) { if (control !== closeButton) control.disabled = true; }); }
  function renderSections() {
    Object.keys(expandedSections).forEach(function(section) {
      const panel = document.getElementById(section + '-panel');
      const toggle = form.querySelector('[data-section="' + section + '"]');
      panel.classList.toggle('is-hidden', !expandedSections[section]);
      toggle.setAttribute('aria-expanded', String(expandedSections[section]));
      toggle.querySelector('.calendar-accordion-indicator').innerHTML = expandedSections[section] ? '&#9662;' : '&#9656;';
    });
  }
  function renderSlots() {
    slotsList.innerHTML = data.slots.map(renderSlot).join('') || '<p class="calendar-empty">Sin tramos.</p>';
  }
  function renderSlot(slot, index) {
    const startField = index === 0
      ? '<label class="form-field"><span>Inicio</span><input type="time" data-kind="slot" data-id="' + escapeAttribute(slot.id) + '" data-field="startTime" value="' + escapeAttribute(slot.startTime) + '" required></label>'
      : '<div class="form-field schedule-derived-time"><span>Inicio</span><strong data-slot-start="' + escapeAttribute(slot.id) + '">' + escapeHtml(slot.startTime || '—') + '</strong></div>';
    return '<div class="schedule-slot-row" data-id="' + escapeAttribute(slot.id) + '">' +
      '<label class="form-field"><span>Tipo</span><select data-kind="slot" data-id="' + escapeAttribute(slot.id) + '" data-field="type">' + enumOptions(data.slotTypes, slot.type) + '</select></label>' +
      startField +
      '<label class="form-field"><span>Duraci&oacute;n</span><span class="schedule-duration-input"><input type="number" min="5" step="5" data-kind="slot" data-id="' + escapeAttribute(slot.id) + '" data-field="durationMinutes" value="' + escapeAttribute(slot.durationMinutes) + '" required><span>min</span></span></label>' +
      '<div class="form-field schedule-derived-time"><span>Finaliza</span><strong data-slot-end="' + escapeAttribute(slot.id) + '">' + escapeHtml(getSlotEndTime(slot) || '—') + '</strong></div>' +
      '<button class="icon-action" type="button" title="Eliminar tramo" aria-label="Eliminar tramo" data-action="remove-slot" data-id="' + escapeAttribute(slot.id) + '">&times;</button></div>';
  }
  function renderActivities() {
    activitiesList.innerHTML = data.activities.map(function(activity) {
      const expanded = Boolean(expandedActivities[activity.id]);
      return '<article class="schedule-activity-card"><div class="schedule-card-header"><button class="calendar-event-toggle" type="button" data-action="toggle-activity" data-id="' + escapeAttribute(activity.id) + '" aria-expanded="' + expanded + '"><span class="calendar-accordion-indicator">' + (expanded ? '&#9662;' : '&#9656;') + '</span><span class="schedule-activity-color" style="background:' + escapeAttribute(activity.color) + '"></span><span class="calendar-event-summary"><strong>' + escapeHtml([activity.acronym, activity.name, activity.group].filter(Boolean).join(' · ')) + '</strong></span></button><button class="icon-action" type="button" title="Eliminar actividad" aria-label="Eliminar actividad" data-action="remove-activity" data-id="' + escapeAttribute(activity.id) + '">&times;</button></div>' +
        '<div class="schedule-activity-panel' + (expanded ? '' : ' is-hidden') + '"><div class="schedule-activity-grid">' +
        activityField(activity, 'category', 'Categoría', selectOptions(data.categories, activity.category), 'select') + activityField(activity, 'name', 'Nombre') + activityField(activity, 'acronym', 'Sigla') + activityField(activity, 'teachingTypeId', 'Tipo de enseñanza', optionHtml([''].concat(data.teachingTypes), activity.teachingTypeId), 'select') + activityField(activity, 'group', 'Grupo') + activityField(activity, 'classroom', 'Aula') + activityField(activity, 'color', 'Color', '', 'color') + '</div></div></article>';
    }).join('') || '<p class="calendar-empty">Sin actividades.</p>';
  }
  function activityField(activity, field, label, options, type) {
    const value = activity[field] || '';
    if (type === 'select') return '<label class="form-field"><span>' + label + '</span><select data-kind="activity" data-id="' + escapeAttribute(activity.id) + '" data-field="' + field + '">' + options + '</select></label>';
    const required = ['name', 'acronym', 'color'].indexOf(field) !== -1 ? ' required' : '';
    return '<label class="form-field"><span>' + label + '</span><input type="' + (type || 'text') + '" data-kind="activity" data-id="' + escapeAttribute(activity.id) + '" data-field="' + field + '" value="' + escapeAttribute(value) + '"' + required + '></label>';
  }
  function renderWeeklyGrid() {
    const header = '<tr><th>Tramo</th>' + data.days.map(function(day) { return '<th>' + escapeHtml(day.label) + '</th>'; }).join('') + '</tr>';
    const rows = data.slots.map(function(slot) { const endTime = getSlotEndTime(slot); const range = slot.startTime && endTime ? slot.startTime + '–' + endTime : 'Horario incompleto'; const label = slot.type === 'DESCANSO' ? '<strong>Recreo</strong><small>' + escapeHtml(range) + '</small>' : '<strong>' + escapeHtml(range) + '</strong>'; return '<tr><th>' + label + '</th>' + data.days.map(function(day) { return renderSessionCell(day.id, slot); }).join('') + '</tr>'; }).join('');
    weeklyGrid.innerHTML = '<div class="schedule-table-wrap"><table class="schedule-table"><thead>' + header + '</thead><tbody>' + (rows || '<tr><td colspan="6">Añade tramos para crear el horario semanal.</td></tr>') + '</tbody></table></div>';
  }
  function renderSessionCell(day, slot) {
    if (slot.type === 'DESCANSO') return '<td class="schedule-break-cell">Descanso</td>';
    const session = getSession(day, slot.id) || { activityId: '', support: '' };
    const activity = data.activities.find(function(item) { return item.id === session.activityId; });
    const cellStyle = activity ? ' style="background-color:' + escapeAttribute(activity.color) + ';color:' + getContrastColor(activity.color) + '"' : '';
    return '<td class="schedule-session-cell" data-activity-id="' + escapeAttribute(session.activityId) + '"' + cellStyle + '><select data-kind="session" data-day="' + day + '" data-slot-id="' + escapeAttribute(slot.id) + '">' + '<option value="">Sin actividad</option>' + data.activities.map(function(item) { return '<option value="' + escapeAttribute(item.id) + '"' + (item.id === session.activityId ? ' selected' : '') + '>' + escapeHtml(scheduleActivityLabel(item)) + '</option>'; }).join('') + '</select><input class="schedule-support" type="text" maxlength="' + escapeAttribute(data.supportMaxLength || 40) + '" aria-label="Apoyo" placeholder="Nombre o identificación" data-kind="support" data-day="' + day + '" data-slot-id="' + escapeAttribute(slot.id) + '" value="' + escapeAttribute(session.support || '') + '"' + (session.activityId ? '' : ' disabled') + '></td>';
  }
  function scheduleActivityLabel(activity) {
    return activity.category === 'MODULO'
      ? [activity.acronym, activity.group].filter(Boolean).join(' · ')
      : [activity.acronym, activity.name].filter(Boolean).join(' · ');
  }
  function handleFieldChange(event) {
    const target = event.target;
    if (target.dataset.kind === 'slot') {
      const slot = data.slots.find(function(item) { return item.id === target.dataset.id; });
      if (slot) {
        slot[target.dataset.field] = target.value;
        if (target.dataset.field === 'startTime' || target.dataset.field === 'durationMinutes') refreshSlotTimes();
        if (event.type === 'change' && target.dataset.field === 'type') {
          if (slot.type === 'DESCANSO') data.sessions = data.sessions.filter(function(session) { return session.slotId !== slot.id; });
          renderSlots();
          renderWeeklyGrid();
        }
      }
    }
    if (target.dataset.kind === 'activity') {
      const activity = data.activities.find(function(item) { return item.id === target.dataset.id; });
      if (activity) {
        activity[target.dataset.field] = target.value;
        if (event.type === 'change' && target.dataset.field === 'category') { applyActivityDefaults(activity); renderActivities(); }
        renderWeeklyGrid();
      }
    }
    if (target.dataset.kind === 'session' || target.dataset.kind === 'support') { updateSessionFromTarget(target); }
    updateSaveButton();
  }
  function updateSessionFromTarget(target) { const session = getSession(target.dataset.day, target.dataset.slotId); const activityId = target.dataset.kind === 'session' ? target.value : (session ? session.activityId : ''); if (!activityId) { data.sessions = data.sessions.filter(function(item) { return !(item.day === target.dataset.day && item.slotId === target.dataset.slotId); }); } else if (session) { if (target.dataset.kind === 'session') session.activityId = activityId; else session.support = target.value; } else { data.sessions.push({ id: '', day: target.dataset.day, slotId: target.dataset.slotId, activityId: activityId, support: '' }); } if (target.dataset.kind === 'session') renderWeeklyGrid(); }
  function handleAction(event) {
    const button = event.target.closest('[data-action]'); if (!button || isBlocked || isSaving) return;
    const action = button.dataset.action;
    if (action === 'toggle-section') { const section = button.dataset.section; const shouldOpen = !expandedSections[section]; Object.keys(expandedSections).forEach(function(id) { expandedSections[id] = shouldOpen && id === section; }); renderSections(); return; }
    if (action === 'toggle-activity') { expandedActivities[button.dataset.id] = !expandedActivities[button.dataset.id]; renderActivities(); return; }
    if (action === 'add-slot') { const previous = data.slots[data.slots.length - 1]; const previousEnd = previous ? getSlotEndMinutes(previous) : null; const canContinue = previousEnd !== null && previousEnd < 1440; const slot = { id: 'local-' + Date.now(), type: 'SESION', name: '', startTime: canContinue ? minutesToTime(previousEnd) : '', durationMinutes: canContinue ? Number(previous.durationMinutes) : '' }; data.slots.push(slot); openOnlySection('slots'); renderAll(); focusSelector('[data-kind="slot"][data-id="' + slot.id + '"][data-field="durationMinutes"]'); }
    if (action === 'remove-slot') removeSlot(button.dataset.id);
    if (action === 'add-activity') { const activity = { id: 'local-' + Date.now(), category: 'MODULO', name: '', acronym: '', teachingTypeId: '', group: '', classroom: '', color: '#DCEAFE' }; data.activities.push(activity); Object.keys(expandedActivities).forEach(function(id) { expandedActivities[id] = false; }); expandedActivities[activity.id] = true; openOnlySection('activities'); renderAll(); focusSelector('[data-kind="activity"][data-id="' + activity.id + '"][data-field="name"]'); }
    if (action === 'remove-activity') removeActivity(button.dataset.id);
    updateSaveButton();
  }
  function removeSlot(id) { const used = data.sessions.filter(function(session) { return session.slotId === id; }).length; const remove = function() { data.slots = data.slots.filter(function(slot) { return slot.id !== id; }); data.sessions = data.sessions.filter(function(session) { return session.slotId !== id; }); normalizeSlotChain(); renderAll(); updateSaveButton(); }; if (!used) { remove(); return; } openConfirmation('Eliminar tramo', 'Este tramo tiene ' + used + ' ' + assignmentLabel(used) + ' en el horario semanal. Si continúas también se ' + (used === 1 ? 'eliminará' : 'eliminarán') + '.', remove); }
  function removeActivity(id) { const activity = data.activities.find(function(item) { return item.id === id; }); const used = data.sessions.filter(function(session) { return session.activityId === id; }).length; const remove = function() { data.activities = data.activities.filter(function(item) { return item.id !== id; }); data.sessions = data.sessions.filter(function(session) { return session.activityId !== id; }); renderAll(); updateSaveButton(); }; if (!used) { remove(); return; } const label = activity ? (activity.acronym || activity.name) : 'seleccionada'; const affected = used === 1 ? 'esa asignación' : 'esas asignaciones'; openConfirmation('Eliminar actividad', 'La actividad «' + label + '» tiene ' + used + ' ' + assignmentLabel(used) + ' en el horario semanal. Si continúas también se ' + (used === 1 ? 'eliminará ' : 'eliminarán ') + affected + '.', remove); }
  function assignmentLabel(count) { return count === 1 ? 'asignación' : 'asignaciones'; }
  function openOnlySection(section) { Object.keys(expandedSections).forEach(function(id) { expandedSections[id] = id === section; }); }
  function openConfirmation(title, message, onAccept) { if (pendingConfirmation) return; pendingConfirmation = onAccept; confirmationTitle.textContent = title; confirmationMessage.textContent = message; confirmationOverlay.classList.remove('is-hidden'); confirmationOverlay.setAttribute('aria-hidden', 'false'); form.inert = true; window.setTimeout(function() { confirmationCancel.focus(); }, 0); }
  function closeConfirmation() { if (!pendingConfirmation) return; pendingConfirmation = null; confirmationOverlay.classList.add('is-hidden'); confirmationOverlay.setAttribute('aria-hidden', 'true'); form.inert = false; }
  function acceptConfirmation() { const action = pendingConfirmation; closeConfirmation(); if (action) action(); }
  function getSession(day, slotId) { return data.sessions.find(function(session) { return session.day === day && session.slotId === slotId; }); }
  function timeToMinutes(value) { const match = /^([01]\d|2[0-3]):([0-5]\d)$/.exec(value || ''); return match ? Number(match[1]) * 60 + Number(match[2]) : null; }
  function minutesToTime(value) { if (!Number.isInteger(value) || value < 0 || value > 1440) return ''; if (value === 1440) return '24:00'; return String(Math.floor(value / 60)).padStart(2, '0') + ':' + String(value % 60).padStart(2, '0'); }
  function isValidDuration(value) { const duration = Number(value); return Number.isInteger(duration) && duration > 0 && duration % 5 === 0; }
  function getSlotEndMinutes(slot) { const start = timeToMinutes(slot.startTime); return start === null || !isValidDuration(slot.durationMinutes) ? null : start + Number(slot.durationMinutes); }
  function getSlotEndTime(slot) { const end = getSlotEndMinutes(slot); return end === null ? '' : minutesToTime(end); }
  function refreshSlotTimes() { normalizeSlotChain(); data.slots.forEach(function(slot) { const startElement = slotsList.querySelector('[data-slot-start="' + CSS.escape(slot.id) + '"]'); const endElement = slotsList.querySelector('[data-slot-end="' + CSS.escape(slot.id) + '"]'); if (startElement) startElement.textContent = slot.startTime || '—'; if (endElement) endElement.textContent = getSlotEndTime(slot) || '—'; }); renderWeeklyGrid(); }
  function sortSlotsChronologically() { data.slots = data.slots.map(function(slot, index) { return { slot: slot, index: index }; }).sort(function(first, second) { const firstTime = timeToMinutes(first.slot.startTime); const secondTime = timeToMinutes(second.slot.startTime); if (firstTime === null && secondTime === null) return first.index - second.index; if (firstTime === null) return 1; if (secondTime === null) return -1; return firstTime - secondTime || first.index - second.index; }).map(function(item) { return item.slot; }); }
  function normalizeSlotChain() { for (let index = 1; index < data.slots.length; index += 1) { const previousEnd = getSlotEndMinutes(data.slots[index - 1]); data.slots[index].startTime = previousEnd !== null && previousEnd < 1440 ? minutesToTime(previousEnd) : ''; } }
  function getAutomaticActivityValues() { const values = { name: ['Nueva actividad'], acronym: ['NUE'] }; Object.keys(data.activityDefaults || {}).forEach(function(category) { const defaults = data.activityDefaults[category]; values.name.push(defaults.name); values.acronym.push(defaults.acronym); }); return values; }
  function applyActivityDefaults(activity) { const defaults = (data.activityDefaults || {})[activity.category] || { name: '', acronym: '' }; const automatic = getAutomaticActivityValues(); if (!activity.name || automatic.name.indexOf(activity.name) !== -1) activity.name = defaults.name; if (!activity.acronym || automatic.acronym.indexOf(activity.acronym) !== -1) activity.acronym = defaults.acronym; }
  function validateSlots() { normalizeSlotChain(); for (let index = 0; index < data.slots.length; index += 1) { const slot = data.slots[index]; const end = getSlotEndMinutes(slot); if (end === null) return 'Completa el inicio del primer tramo y una duración múltiplo de 5 en todos los tramos.'; if (end > 1440) return 'El tramo ' + (index + 1) + ' no puede finalizar después de las 24:00.'; const previous = data.slots[index - 1]; if (previous && timeToMinutes(slot.startTime) !== getSlotEndMinutes(previous)) return 'Todos los tramos deben ser consecutivos.'; } return ''; }
  function getContrastColor(color) { const hex = String(color || '').replace('#', ''); if (!/^[0-9A-F]{6}$/i.test(hex)) return '#1F2937'; const red = parseInt(hex.slice(0, 2), 16); const green = parseInt(hex.slice(2, 4), 16); const blue = parseInt(hex.slice(4, 6), 16); return (red * 299 + green * 587 + blue * 114) / 1000 >= 150 ? '#1F2937' : '#FFFFFF'; }
  function getPayload() { normalizeSlotChain(); return { slots: data.slots.map(function(slot) { return Object.assign({}, slot); }), activities: data.activities.map(function(activity) { return Object.assign({}, activity); }), sessions: data.sessions.map(function(session) { return Object.assign({}, session); }) }; }
  function serialize() { return JSON.stringify({ slots: data.slots, activities: data.activities, sessions: data.sessions }); }
  function isDirty() { return serialize() !== baseline; }
  function updateSaveButton() { saveButton.disabled = isBlocked || isSaving || (!WIZARD_STEP && !isDirty()); }
  function setSavingState(saving) { isSaving = saving; form.classList.toggle('is-saving', saving); closeButton.disabled = saving; saveButton.disabled = saving; form.querySelector('.config-scroll').classList.toggle('is-hidden', saving); saveLoading.classList.toggle('is-hidden', !saving); updateSaveButton(); }
  function handleSaveError(error) { setSavingState(false); showResult(error && error.message ? error.message : 'No se ha podido guardar el horario.', 'error'); }
  function showResult(message, state) { resultElement.textContent = message; resultElement.className = 'result visible ' + state; }
  function hideResult() { resultElement.textContent = ''; resultElement.className = 'result'; }
  function focusSelector(selector) { window.setTimeout(function() { const element = form.querySelector(selector); if (element) { element.focus(); element.scrollIntoView({ block: 'nearest' }); } }, 0); }
  function optionHtml(options, selected) { return options.map(function(value) { const id = typeof value === 'string' ? value : value.id; const label = typeof value === 'string' ? (data.slotTypes[id] || id) : value.label; return '<option value="' + escapeAttribute(id) + '"' + (id === selected ? ' selected' : '') + '>' + escapeHtml(label) + '</option>'; }).join(''); }
  function enumOptions(options, selected) { return Object.keys(options).map(function(id) { return '<option value="' + id + '"' + (id === selected ? ' selected' : '') + '>' + escapeHtml(options[id]) + '</option>'; }).join(''); }
  function selectOptions(options, selected) { return options.map(function(value) { return '<option value="' + escapeAttribute(value) + '"' + (value === selected ? ' selected' : '') + '>' + escapeHtml(value) + '</option>'; }).join(''); }
  function clone(value) { return JSON.parse(JSON.stringify(value)); }
  function escapeHtml(value) { const element = document.createElement('div'); element.textContent = value === null || value === undefined ? '' : String(value); return element.innerHTML; }
  function escapeAttribute(value) { return escapeHtml(value).replace(/"/g, '&quot;'); }
</script>
</body>
