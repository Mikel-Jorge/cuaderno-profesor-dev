<!DOCTYPE html>
<html lang="es">
<head>
  <base target="_top">
  <meta charset="utf-8">
  <style><?!= uiThemeCss ?></style>
  <?!= includeUiFile_('UiStyles'); ?>
</head>
<body>
<main class="app">
  <header class="brand-header">
    <img class="brand-logo" src="<?!= branding.icon ?>" alt="">
    <div class="brand-copy"><p class="brand-name"><?= uiConfig.projectName ?></p><span class="version-label"><?= uiConfig.versionLabel ?></span></div>
  </header>
  <form class="config-form" id="calendar-form">
    <div class="config-scroll">
      <p class="calendar-course" id="calendar-course"></p>
      <div class="result" id="blocking-error" role="alert"></div>
      <div class="calendar-accordions" id="types-list"></div>
      <div id="events-section"></div>
    </div>
    <div class="config-feedback">
      <div class="result" id="form-result" role="status"></div>
      <div class="actions">
        <button class="button button-secondary" id="close-button" type="button">Cancelar</button>
        <button class="button" id="save-button" type="submit" disabled>Guardar</button>
      </div>
    </div>
  </form>
  <footer class="author-footer">&copy; <?= uiConfig.author ?> &middot; <a href="mailto:<?= uiConfig.authorEmail ?>"><?= uiConfig.authorEmail ?></a></footer>
</main>
<script>
  const INITIAL_CALENDAR_CONFIG = <?!= JSON.stringify(calendarConfig) ?>;
  const form = document.getElementById('calendar-form');
  const typesList = document.getElementById('types-list');
  const eventsSection = document.getElementById('events-section');
  const closeButton = document.getElementById('close-button');
  const saveButton = document.getElementById('save-button');
  const resultElement = document.getElementById('form-result');
  const blockingErrorElement = document.getElementById('blocking-error');
  let calendarData = cloneData(INITIAL_CALENDAR_CONFIG);
  let baseline = '';
  let isSaving = false;
  const isBlocked = Boolean(calendarData.blockingError);
  const expandedTypes = {};
  let eventsExpanded = false;
  let nextEventUiKey = 1;
  let expandedEvents = {};
  ensureEventUiKeys();

  document.getElementById('calendar-course').textContent = calendarData.academicYear
    ? 'Curso acad\u00e9mico ' + calendarData.academicYear : 'Curso acad\u00e9mico sin configurar';
  if (isBlocked) {
    blockingErrorElement.textContent = calendarData.blockingError;
    blockingErrorElement.className = 'result visible error';
  }
  renderAll();
  baseline = serializeData();
  updateSaveButton();

  form.addEventListener('input', handleFieldChange);
  form.addEventListener('change', handleFieldChange);
  form.addEventListener('click', handleActionClick);
  form.addEventListener('submit', function(domEvent) {
    domEvent.preventDefault();
    if (isBlocked || isSaving || !isDirty() || !form.reportValidity() || !validateEventScopes()) return;
    setSavingState(true);
    hideResult();
    google.script.run.withSuccessHandler(handleSaveSuccess).withFailureHandler(handleSaveError)
      .guardarConfiguracionCalendario(getCalendarPayloadData());
  });
  closeButton.addEventListener('click', function() { google.script.host.close(); });

  function renderAll() {
    renderTypes();
    renderEvents();
    if (isBlocked) {
      form.querySelectorAll('input, select, button').forEach(function(control) {
        if (control !== closeButton) control.disabled = true;
      });
    }
  }

  function renderTypes() {
    typesList.innerHTML = calendarData.types.map(function(type, typeIndex) {
      const expanded = Boolean(expandedTypes[typeIndex]);
      const evaluations = type.evaluations.map(function(evaluation, evaluationIndex) {
        return '<div class="calendar-row evaluation-row">' +
          fieldInput('Nombre', 'text', evaluation.name, 'evaluation', typeIndex, evaluationIndex, 'name', type.active, type.active) +
          fieldInput('Fecha final', 'date', evaluation.endDate, 'evaluation', typeIndex, evaluationIndex, 'endDate', type.active, type.active) +
          removeButton('evaluation', typeIndex, evaluationIndex, 'Eliminar evaluaci\u00f3n', type.active) + '</div>';
      }).join('');
      return '<article class="calendar-accordion">' +
        '<div class="calendar-accordion-header">' +
          '<button class="calendar-accordion-toggle" type="button" data-action="toggle-type" data-type-index="' + typeIndex + '" aria-expanded="' + expanded + '">' +
            '<span class="calendar-accordion-indicator" aria-hidden="true">' + (expanded ? '&#9662;' : '&#9656;') + '</span>' +
            '<span class="calendar-accordion-title">' + escapeHtml(type.name) + '</span>' +
            '<span class="calendar-status ' + (type.active ? 'is-active' : '') + '">' + (type.active ? 'Activo' : 'Inactivo') + '</span>' +
          '</button>' +
          '<label class="calendar-active-toggle"><input type="checkbox" data-kind="type" data-type-index="' + typeIndex + '" data-field="active"' +
            (type.active ? ' checked' : '') + '> Activar este tipo</label>' +
        '</div>' +
        '<div class="calendar-accordion-panel' + (expanded ? '' : ' is-hidden') + (type.active ? '' : ' is-disabled') + '">' +
          '<div class="calendar-date-grid">' +
            fieldInput('Inicio del periodo lectivo', 'date', type.startDate, 'type', typeIndex, '', 'startDate', type.active, type.active) +
            fieldInput('Fin del periodo lectivo', 'date', type.endDate, 'type', typeIndex, '', 'endDate', type.active, type.active) +
          '</div>' +
          '<div class="calendar-subsection"><div class="section-heading"><h3>Evaluaciones</h3>' +
            '<button class="button button-secondary compact-button" type="button" data-action="add-evaluation" data-type-index="' + typeIndex + '"' + disabledAttribute(!type.active) + '>+ A&ntilde;adir evaluaci&oacute;n</button></div>' +
            '<div class="calendar-list">' + (evaluations || '<p class="calendar-empty">Sin evaluaciones configuradas.</p>') + '</div></div>' +
          optionalPeriod(type, typeIndex, 'pr\u00e1cticas', 'practicesStart', 'practicesEnd', 'configurePractices') +
          optionalPeriod(type, typeIndex, 'repaso', 'reviewStart', 'reviewEnd', 'configureReview') +
        '</div></article>';
    }).join('');
  }

  function optionalPeriod(type, typeIndex, label, startField, endField, toggleField) {
    const configured = Boolean(type[toggleField]);
    return '<div class="calendar-subsection">' +
      '<label class="calendar-option-toggle"><input type="checkbox" data-kind="type" data-type-index="' + typeIndex + '" data-field="' + toggleField + '"' +
        (configured ? ' checked' : '') + disabledAttribute(!type.active) + '> Configurar periodo de ' + label + '</label>' +
      '<div class="calendar-date-grid optional-period' + (configured ? '' : ' is-hidden') + '">' +
        fieldInput('Inicio ' + label, 'date', type[startField], 'type', typeIndex, '', startField, configured && type.active, type.active) +
        fieldInput('Fin ' + label, 'date', type[endField], 'type', typeIndex, '', endField, configured && type.active, type.active) +
      '</div></div>';
  }

  function renderEvents() {
    const events = calendarData.events.map(function(calendarEvent, eventIndex) {
      const expanded = Boolean(expandedEvents[calendarEvent.__uiKey]);
      const summary = getEventSummary(calendarEvent);
      const scopeOptions = calendarData.types.map(function(type) {
        const checked = calendarEvent.typeIds.indexOf(type.id) !== -1;
        return '<label class="scope-option"><input type="checkbox" data-kind="event-scope" data-item-index="' + eventIndex + '" data-type-id="' + escapeAttribute(type.id) + '"' +
          (checked ? ' checked' : '') + disabledAttribute(calendarEvent.appliesToAll) + '> ' + escapeHtml(type.name) + '</label>';
      }).join('');
      return '<article class="calendar-event">' +
        '<button class="calendar-event-toggle" type="button" data-action="toggle-event" data-item-index="' + eventIndex + '" aria-expanded="' + expanded + '">' +
          '<span class="calendar-accordion-indicator" aria-hidden="true">' + (expanded ? '&#9662;' : '&#9656;') + '</span>' +
          '<span class="calendar-event-summary"><strong>' + escapeHtml(summary.title) + '</strong>' +
            (summary.description ? '<small>' + escapeHtml(summary.description) + '</small>' : '') + '</span></button>' +
        '<div class="calendar-event-panel' + (expanded ? '' : ' is-hidden') + '"><div class="calendar-event-grid">' +
          fieldInput('Fecha', 'date', calendarEvent.startDate, 'event', '', eventIndex, 'startDate', true, true) +
          '<label class="calendar-option-toggle range-toggle"><input type="checkbox" data-kind="event" data-item-index="' + eventIndex + '" data-field="isRange"' + (calendarEvent.isRange ? ' checked' : '') + '> Rango de fechas</label>' +
          (calendarEvent.isRange ? fieldInput('Hasta', 'date', calendarEvent.endDate, 'event', '', eventIndex, 'endDate', true, true) : '') +
          selectField('Categor\u00eda', calendarEvent.category, calendarData.categories, 'category', eventIndex) +
          '<fieldset class="calendar-scope"><legend>Aplicar a</legend>' +
            '<label class="scope-option scope-all"><input type="checkbox" data-kind="event" data-item-index="' + eventIndex + '" data-field="appliesToAll"' + (calendarEvent.appliesToAll ? ' checked' : '') + '> Todos</label>' + scopeOptions + '</fieldset>' +
          fieldInput('Descripci\u00f3n', 'text', calendarEvent.description, 'event', '', eventIndex, 'description', false, true, 'wide') +
          removeButton('event', '', eventIndex, 'Eliminar fecha especial', true) +
        '</div></div></article>';
    }).join('');
    eventsSection.innerHTML = '<section class="calendar-accordion calendar-events-accordion"><div class="calendar-accordion-header">' +
      '<button class="calendar-accordion-toggle" type="button" data-action="toggle-events" aria-expanded="' + eventsExpanded + '">' +
        '<span class="calendar-accordion-indicator" aria-hidden="true">' + (eventsExpanded ? '&#9662;' : '&#9656;') + '</span>' +
        '<span class="calendar-accordion-title">Fechas especiales</span><span class="calendar-status">' + calendarData.events.length + '</span></button></div>' +
      '<div class="calendar-accordion-panel' + (eventsExpanded ? '' : ' is-hidden') + '">' +
        '<div class="calendar-list">' + events + '</div>' +
        '<div class="calendar-events-actions"><button class="button button-secondary compact-button" data-action="add-event" type="button">+ A&ntilde;adir fecha</button></div></div></section>';
  }

  function fieldInput(label, type, value, kind, typeIndex, itemIndex, field, required, enabled, extraClass) {
    return '<label class="form-field calendar-field ' + (extraClass || '') + '"><span>' + escapeHtml(label) + '</span>' +
      '<input type="' + type + '" value="' + escapeAttribute(value || '') + '" data-kind="' + kind + '"' + dataIndexAttributes(typeIndex, itemIndex) +
      ' data-field="' + field + '"' + (required ? ' required' : '') + disabledAttribute(!enabled) + '></label>';
  }

  function selectField(label, value, options, field, eventIndex) {
    const optionHtml = options.map(function(option) {
      return '<option value="' + escapeAttribute(option.id) + '"' + (option.id === value ? ' selected' : '') + '>' + escapeHtml(option.label || option.name) + '</option>';
    }).join('');
    return '<label class="form-field calendar-field"><span>' + escapeHtml(label) + '</span><select data-kind="event" data-item-index="' + eventIndex + '" data-field="' + field + '">' + optionHtml + '</select></label>';
  }

  function removeButton(kind, typeIndex, itemIndex, title, enabled) {
    return '<button class="icon-action" type="button" title="' + escapeAttribute(title) + '" aria-label="' + escapeAttribute(title) + '" data-action="remove-' + kind + '"' +
      dataIndexAttributes(typeIndex, itemIndex) + disabledAttribute(!enabled) + '>&times;</button>';
  }
  function dataIndexAttributes(typeIndex, itemIndex) {
    return (typeIndex === '' ? '' : ' data-type-index="' + typeIndex + '"') + (itemIndex === '' ? '' : ' data-item-index="' + itemIndex + '"');
  }
  function disabledAttribute(disabled) { return disabled ? ' disabled' : ''; }

  function handleFieldChange(domEvent) {
    const target = domEvent.target;
    const kind = target.dataset.kind;
    if (!kind) return;
    const field = target.dataset.field;
    const value = target.type === 'checkbox' ? target.checked : target.value;
    if (kind === 'type') {
      const typeIndex = Number(target.dataset.typeIndex);
      const type = calendarData.types[typeIndex];
      type[field] = value;
      if (field === 'active' && domEvent.type === 'change') {
        if (!value) expandedTypes[typeIndex] = false;
        renderTypes();
      } else if ((field === 'configurePractices' || field === 'configureReview') && domEvent.type === 'change') {
        renderTypes();
      } else if (domEvent.type === 'change') {
        proposeTypeEndDate(type, field, target);
      }
    } else if (kind === 'evaluation') {
      calendarData.types[Number(target.dataset.typeIndex)].evaluations[Number(target.dataset.itemIndex)][field] = value;
    } else if (kind === 'event') {
      const calendarEvent = calendarData.events[Number(target.dataset.itemIndex)];
      calendarEvent[field] = value;
      if (field === 'appliesToAll') {
        if (value) calendarEvent.typeIds = [];
        renderEvents();
      } else if (field === 'isRange' && domEvent.type === 'change') {
        if (value && !calendarEvent.endDate && calendarEvent.startDate) calendarEvent.endDate = addOneDay(calendarEvent.startDate);
        renderEvents();
      } else if (field === 'startDate' && domEvent.type === 'change' && calendarEvent.isRange && !calendarEvent.endDate) {
        calendarEvent.endDate = addOneDay(calendarEvent.startDate);
        renderEvents();
      }
    } else if (kind === 'event-scope') {
      const calendarEvent = calendarData.events[Number(target.dataset.itemIndex)];
      const typeId = target.dataset.typeId;
      if (target.checked && calendarEvent.typeIds.indexOf(typeId) === -1) calendarEvent.typeIds.push(typeId);
      if (!target.checked) calendarEvent.typeIds = calendarEvent.typeIds.filter(function(id) { return id !== typeId; });
      if (calendarEvent.typeIds.length) calendarEvent.appliesToAll = false;
      renderEvents();
    }
    hideResult();
    updateSaveButton();
  }

  function proposeTypeEndDate(type, field, target) {
    const endField = { startDate: 'endDate', practicesStart: 'practicesEnd', reviewStart: 'reviewEnd' }[field];
    if (!endField || !type[field] || type[endField]) return;
    type[endField] = addOneDay(type[field]);
    const endInput = form.querySelector('[data-kind="type"][data-type-index="' + target.dataset.typeIndex + '"][data-field="' + endField + '"]');
    if (endInput) endInput.value = type[endField];
  }

  function handleActionClick(domEvent) {
    const button = domEvent.target.closest('[data-action]');
    if (!button || isBlocked || isSaving) return;
    const action = button.dataset.action;
    const typeIndex = Number(button.dataset.typeIndex);
    const itemIndex = Number(button.dataset.itemIndex);
    if (action === 'toggle-type') {
      expandedTypes[typeIndex] = !expandedTypes[typeIndex]; renderTypes(); return;
    }
    if (action === 'toggle-events') {
      eventsExpanded = !eventsExpanded; renderEvents(); return;
    }
    if (action === 'toggle-event') {
      const calendarEvent = calendarData.events[itemIndex];
      expandedEvents[calendarEvent.__uiKey] = !expandedEvents[calendarEvent.__uiKey];
      renderEvents(); return;
    }
    if (action === 'add-evaluation') {
      const evaluations = calendarData.types[typeIndex].evaluations;
      const previous = evaluations.length ? evaluations[evaluations.length - 1] : null;
      evaluations.push({ id: '', name: (evaluations.length + 1) + '\u00aa evaluaci\u00f3n', endDate: previous && previous.endDate ? addOneDay(previous.endDate) : '' });
      renderTypes();
    } else if (action === 'remove-evaluation') {
      calendarData.types[typeIndex].evaluations.splice(itemIndex, 1); renderTypes();
    } else if (action === 'add-event') {
      const newEvent = { id: '', startDate: '', endDate: '', isRange: false, category: 'FESTIVO', appliesToAll: true, typeIds: [], description: '' };
      assignEventUiKey(newEvent);
      expandedEvents = {};
      calendarData.events.push(newEvent);
      expandedEvents[newEvent.__uiKey] = true;
      eventsExpanded = true;
      renderEvents();
      focusEventEditor(calendarData.events.length - 1);
    } else if (action === 'remove-event') {
      calendarData.events.splice(itemIndex, 1); renderEvents();
    }
    hideResult(); updateSaveButton();
  }

  function addOneDay(dateKey) {
    if (!/^\d{4}-\d{2}-\d{2}$/.test(dateKey || '')) return '';
    const parts = dateKey.split('-').map(Number);
    const date = new Date(parts[0], parts[1] - 1, parts[2], 12, 0, 0);
    date.setDate(date.getDate() + 1);
    return [date.getFullYear(), padDatePart(date.getMonth() + 1), padDatePart(date.getDate())].join('-');
  }
  function padDatePart(value) { return String(value).padStart(2, '0'); }

  function ensureEventUiKeys() {
    calendarData.events.forEach(assignEventUiKey);
  }

  function assignEventUiKey(calendarEvent) {
    if (!calendarEvent.__uiKey) {
      calendarEvent.__uiKey = 'event-' + nextEventUiKey;
      nextEventUiKey += 1;
    }
  }

  function getEventSummary(calendarEvent) {
    return {
      title: [
        getEventCategoryLabel(calendarEvent.category).toUpperCase(),
        getEventDateSummary(calendarEvent),
        getEventScopeSummary(calendarEvent)
      ].filter(Boolean).join(' \u00b7 '),
      description: compactSummaryText(calendarEvent.description)
    };
  }

  function getEventCategoryLabel(categoryId) {
    const category = calendarData.categories.find(function(item) { return item.id === categoryId; });
    return category ? category.label : categoryId || 'Fecha especial';
  }

  function getEventDateSummary(calendarEvent) {
    const start = formatDisplayDate(calendarEvent.startDate);
    if (!calendarEvent.isRange) return start || 'Sin fecha';
    const end = formatDisplayDate(calendarEvent.endDate);
    return (start || 'Sin inicio') + ' \u2192 ' + (end || 'Sin fin');
  }

  function getEventScopeSummary(calendarEvent) {
    if (calendarEvent.appliesToAll) return 'Todos';
    return calendarEvent.typeIds.map(function(typeId) {
      const type = calendarData.types.find(function(item) { return item.id === typeId; });
      return type ? type.name : '';
    }).filter(Boolean).join(' + ');
  }

  function formatDisplayDate(dateKey) {
    if (!/^\d{4}-\d{2}-\d{2}$/.test(dateKey || '')) return '';
    const parts = dateKey.split('-');
    return parts[2] + '/' + parts[1] + '/' + parts[0];
  }

  function focusEventEditor(eventIndex) {
    window.setTimeout(function() {
      const input = form.querySelector('[data-kind="event"][data-item-index="' + eventIndex + '"][data-field="startDate"]');
      if (!input) return;
      input.focus();
      input.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
    }, 0);
  }

  function compactSummaryText(value) {
    const text = (value || '').trim();
    return text.length > 90 ? text.slice(0, 87).trim() + '...' : text;
  }

  function validateEventScopes() {
    const invalid = calendarData.events.some(function(calendarEvent) { return !calendarEvent.appliesToAll && calendarEvent.typeIds.length === 0; });
    if (!invalid) return true;
    eventsExpanded = true; renderEvents();
    showResult('Selecciona Todos o al menos un tipo en cada fecha especial.', 'error');
    return false;
  }
  function handleSaveSuccess(response) {
    if (response && response.data) {
      calendarData = cloneData(response.data);
      ensureEventUiKeys();
    }
    baseline = serializeData(); setSavingState(false); closeButton.textContent = 'Cerrar';
    showResult(response.message, 'success');
    window.setTimeout(function() { google.script.host.close(); }, 450);
  }
  function handleSaveError(error) {
    setSavingState(false);
    showResult(error && error.message ? error.message : 'No se ha podido guardar el calendario.', 'error');
  }
  function getCalendarPayloadData() {
    return {
      types: calendarData.types.map(function(type) {
        return {
          id: type.id,
          name: type.name,
          active: type.active,
          startDate: type.startDate,
          endDate: type.endDate,
          practicesStart: type.practicesStart,
          practicesEnd: type.practicesEnd,
          configurePractices: type.configurePractices,
          reviewStart: type.reviewStart,
          reviewEnd: type.reviewEnd,
          configureReview: type.configureReview,
          evaluations: type.evaluations.map(function(evaluation) {
            return {
              id: evaluation.id,
              name: evaluation.name,
              endDate: evaluation.endDate
            };
          })
        };
      }),
      events: calendarData.events.map(function(calendarEvent) {
        return {
          id: calendarEvent.id,
          startDate: calendarEvent.startDate,
          endDate: calendarEvent.endDate,
          isRange: calendarEvent.isRange,
          category: calendarEvent.category,
          appliesToAll: calendarEvent.appliesToAll,
          typeIds: calendarEvent.typeIds.slice(),
          description: calendarEvent.description
        };
      })
    };
  }
  function serializeData() { return JSON.stringify(getCalendarPayloadData()); }
  function isDirty() { return serializeData() !== baseline; }
  function updateSaveButton() { saveButton.disabled = isBlocked || isSaving || !isDirty(); }
  function setSavingState(saving) {
    isSaving = saving; closeButton.disabled = saving; saveButton.textContent = saving ? 'Guardando...' : 'Guardar'; updateSaveButton();
  }
  function showResult(message, state) { resultElement.textContent = message; resultElement.className = 'result visible ' + state; }
  function hideResult() { resultElement.textContent = ''; resultElement.className = 'result'; }
  function cloneData(value) { return JSON.parse(JSON.stringify(value)); }
  function escapeHtml(value) {
    const element = document.createElement('div');
    element.textContent = value === null || value === undefined ? '' : String(value);
    return element.innerHTML;
  }
  function escapeAttribute(value) { return escapeHtml(value).replace(/"/g, '&quot;'); }
</script>
</body>
</html>
