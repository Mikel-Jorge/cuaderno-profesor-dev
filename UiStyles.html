<style>
  * {
    box-sizing: border-box;
  }

  body {
    margin: 0;
    background: var(--background);
    color: var(--text);
    font-family: Arial, Helvetica, sans-serif;
    font-size: 14px;
    line-height: 1.45;
  }

  .app {
    display: flex;
    min-height: 100vh;
    flex-direction: column;
    background: var(--surface);
  }

  .brand-header {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 16px 20px;
    border-bottom: 1px solid var(--border);
  }

  .brand-logo {
    width: 42px;
    height: 52px;
    object-fit: contain;
  }

  .brand-copy {
    min-width: 0;
    flex: 1;
  }

  .brand-name {
    margin: 0;
    font-size: 16px;
    font-weight: 700;
  }

  .version-label {
    display: inline-block;
    margin-top: 3px;
    color: var(--muted-text);
    font-size: 11px;
    font-weight: 700;
  }

  .process {
    display: flex;
    flex: 1;
    flex-direction: column;
    padding: 20px;
  }

  .progress-step {
    margin: 0;
    font-size: 18px;
    font-weight: 700;
  }

  .activity {
    display: flex;
    align-items: center;
    gap: 12px;
    margin: 8px 0 14px;
    color: var(--muted-text);
  }

  .spinner {
    width: 22px;
    height: 22px;
    flex: 0 0 auto;
    border: 3px solid var(--muted);
    border-top-color: var(--primary);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }

  @keyframes spin {
    to { transform: rotate(360deg); }
  }

  .progress-track {
    overflow: hidden;
    height: 6px;
    margin-bottom: 16px;
    background: var(--muted);
    border-radius: 3px;
  }

  .progress-bar {
    width: 0;
    height: 100%;
    background: var(--primary);
    transition: width 180ms ease;
  }

  .log {
    min-height: 128px;
    max-height: 150px;
    margin: 0;
    padding: 12px 12px 12px 30px;
    overflow: auto;
    border: 1px solid var(--border);
    background: var(--background);
    color: var(--text);
    font-size: 13px;
  }

  .log li + li {
    margin-top: 5px;
  }

  .log .error-entry {
    color: var(--danger);
    font-weight: 700;
  }

  .result {
    display: none;
    margin-top: 16px;
    padding: 12px;
    border: 1px solid transparent;
    border-radius: 6px;
  }

  .result.visible {
    display: block;
  }

  .result.success {
    border-color: var(--success);
    background: var(--background);
    color: var(--success);
  }

  .result.error {
    border-color: var(--danger);
    background: var(--background);
    color: var(--danger);
  }

  .actions {
    display: flex;
    justify-content: flex-end;
    min-height: 38px;
    margin-top: 16px;
  }

  .button {
    min-width: 96px;
    padding: 9px 16px;
    border: 0;
    border-radius: 5px;
    background: var(--primary);
    color: var(--on-primary);
    cursor: pointer;
    font: inherit;
    font-weight: 700;
  }

  .button.is-hidden {
    display: none;
  }

  .button:hover,
  .button:focus-visible {
    filter: brightness(0.88);
  }

  .button-secondary {
    border: 1px solid var(--border);
    background: var(--muted);
    color: var(--text);
  }

  .button-secondary:hover,
  .button-secondary:focus-visible {
    filter: brightness(0.92);
  }

  .button-warning {
    background: var(--warning);
  }

  .button-warning:hover,
  .button-warning:focus-visible {
    filter: brightness(0.88);
  }

  .button-danger {
    background: var(--danger);
  }

  .button-danger:hover,
  .button-danger:focus-visible {
    filter: brightness(0.88);
  }

  .button:disabled {
    cursor: not-allowed;
    opacity: 0.65;
  }

  .confirmation {
    display: flex;
    flex: 1;
    flex-direction: column;
    padding: 24px 20px 20px;
    border-top: 4px solid var(--primary);
  }

  .confirmation-warning {
    border-top-color: var(--warning);
  }

  .confirmation-danger {
    border-top-color: var(--danger);
  }

  .confirmation-message {
    margin: 0;
    color: var(--text);
    font-size: 15px;
  }

  .confirmation-helper {
    margin: 10px 0 0;
    color: var(--muted-text);
  }

  .confirmation-error {
    min-height: 21px;
    margin: 16px 0 0;
    color: var(--danger);
    font-size: 13px;
    font-weight: 700;
  }

  .confirmation .actions {
    gap: 10px;
    margin-top: auto;
  }

  .config-form {
    display: flex;
    flex: 1;
    flex-direction: column;
    min-height: 0;
    overflow: hidden;
  }

  .config-scroll {
    min-height: 0;
    padding: 18px 20px;
    overflow-y: auto;
  }

  .form-section + .form-section {
    margin-top: 22px;
    padding-top: 18px;
    border-top: 1px solid var(--border);
  }

  .form-section h2 {
    margin: 0 0 12px;
    color: var(--text);
    font-size: 14px;
    letter-spacing: 0;
  }

  .form-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 14px 16px;
  }

  .form-field {
    min-width: 0;
  }

  .form-field-wide {
    grid-column: 1 / -1;
  }

  .form-field label {
    display: block;
    margin-bottom: 5px;
    color: var(--text);
    font-size: 12px;
    font-weight: 700;
  }

  .form-field input,
  .form-field select {
    width: 100%;
    min-height: 38px;
    padding: 8px 10px;
    border: 1px solid var(--border);
    border-radius: 5px;
    background: var(--surface);
    color: var(--text);
    font: inherit;
  }

  .form-field input:focus,
  .form-field select:focus {
    border-color: var(--primary);
    outline: 2px solid var(--muted);
    outline-offset: 0;
  }

  .form-help {
    margin: 5px 0 0;
    color: var(--muted-text);
    font-size: 11px;
  }

  .config-form .result {
    margin: 0 0 12px;
  }

  .config-form .actions {
    gap: 10px;
    margin-top: 0;
  }

  .config-feedback {
    flex: 0 0 auto;
    padding: 12px 20px 16px;
    border-top: 1px solid var(--border);
    background: var(--surface);
  }

  .theme-colors {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 10px;
  }

  .color-field {
    display: flex;
    align-items: center;
    justify-content: space-between;
    min-height: 42px;
    padding: 6px 8px;
    border: 1px solid var(--border);
    border-radius: 5px;
    background: var(--background);
    color: var(--text);
    font-size: 12px;
    font-weight: 700;
  }

  .color-field input[type="color"] {
    width: 38px;
    min-height: 28px;
    padding: 2px;
    cursor: pointer;
  }

  .author-footer {
    padding: 10px 20px 14px;
    border-top: 1px solid var(--border);
    color: var(--muted-text);
    font-size: 11px;
    text-align: center;
  }

  .author-footer a {
    color: inherit;
  }

  @media (max-width: 520px) {
    .form-grid {
      grid-template-columns: 1fr;
    }

    .form-field-wide {
      grid-column: auto;
    }

    .theme-colors {
      grid-template-columns: 1fr;
    }
  }
</style>
