<style>
  * {
    box-sizing: border-box;
  }

  body {
    margin: 0;
    max-width: 100%;
    overflow-x: hidden;
    background: var(--background);
    color: var(--text);
    font-family: Arial, Helvetica, sans-serif;
    font-size: 14px;
    line-height: 1.45;
  }

  .app {
    display: flex;
    min-height: 100vh;
    flex-direction: column;
    background: var(--surface);
  }

  .brand-header {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 16px 20px;
    border-bottom: 1px solid var(--border);
  }

  .brand-logo {
    width: 42px;
    height: 52px;
    object-fit: contain;
  }

  .brand-copy {
    min-width: 0;
    flex: 1;
  }

  .brand-name {
    margin: 0;
    font-size: 16px;
    font-weight: 700;
  }

  .version-label {
    display: inline-block;
    margin-top: 3px;
    color: var(--muted-text);
    font-size: 11px;
    font-weight: 700;
  }

  .process {
    display: flex;
    flex: 1;
    flex-direction: column;
    padding: 20px;
  }

  .progress-step {
    margin: 0;
    font-size: 18px;
    font-weight: 700;
  }

  .activity {
    display: flex;
    align-items: center;
    gap: 12px;
    margin: 8px 0 14px;
    color: var(--muted-text);
  }

  .spinner {
    width: 22px;
    height: 22px;
    flex: 0 0 auto;
    border: 3px solid var(--muted);
    border-top-color: var(--primary);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }

  @keyframes spin {
    to { transform: rotate(360deg); }
  }

  .progress-track {
    overflow: hidden;
    height: 6px;
    margin-bottom: 16px;
    background: var(--muted);
    border-radius: 3px;
  }

  .progress-bar {
    width: 0;
    height: 100%;
    background: var(--primary);
    transition: width 180ms ease;
  }

  .log {
    min-height: 128px;
    max-height: 150px;
    margin: 0;
    padding: 12px 12px 12px 30px;
    overflow: auto;
    border: 1px solid var(--border);
    background: var(--background);
    color: var(--text);
    font-size: 13px;
  }

  .log li + li {
    margin-top: 5px;
  }

  .log .error-entry {
    color: var(--danger);
    font-weight: 700;
  }

  .result {
    display: none;
    margin-top: 16px;
    padding: 12px;
    border: 1px solid transparent;
    border-radius: 6px;
  }

  .result.visible {
    display: block;
  }

  .result.success {
    border-color: var(--success);
    background: var(--background);
    color: var(--success);
  }

  .result.error {
    border-color: var(--danger);
    background: var(--background);
    color: var(--danger);
  }

  .actions {
    display: flex;
    justify-content: flex-end;
    min-height: 38px;
    margin-top: 16px;
  }

  .button {
    min-width: 96px;
    padding: 9px 16px;
    border: 0;
    border-radius: 5px;
    background: var(--primary);
    color: var(--on-primary);
    cursor: pointer;
    font: inherit;
    font-weight: 700;
  }

  .button.is-hidden {
    display: none;
  }

  .button:hover,
  .button:focus-visible {
    filter: brightness(0.88);
  }

  .button-secondary {
    border: 1px solid var(--border);
    background: var(--muted);
    color: var(--text);
  }

  .button-secondary:hover,
  .button-secondary:focus-visible {
    filter: brightness(0.92);
  }

  .button-warning {
    background: var(--warning);
  }

  .button-warning:hover,
  .button-warning:focus-visible {
    filter: brightness(0.88);
  }

  .button-danger {
    background: var(--danger);
  }

  .button-danger:hover,
  .button-danger:focus-visible {
    filter: brightness(0.88);
  }

  .button:disabled {
    cursor: not-allowed;
    opacity: 0.65;
  }

  .confirmation {
    display: flex;
    flex: 1;
    flex-direction: column;
    padding: 24px 20px 20px;
    border-top: 4px solid var(--primary);
  }

  .confirmation-warning {
    border-top-color: var(--warning);
  }

  .confirmation-danger {
    border-top-color: var(--danger);
  }

  .confirmation-message {
    margin: 0;
    color: var(--text);
    font-size: 15px;
  }

  .confirmation-helper {
    margin: 10px 0 0;
    color: var(--muted-text);
  }

  .confirmation-error {
    min-height: 21px;
    margin: 16px 0 0;
    color: var(--danger);
    font-size: 13px;
    font-weight: 700;
  }

  .confirmation .actions {
    gap: 10px;
    margin-top: auto;
  }

  .config-form {
    display: flex;
    flex: 1;
    flex-direction: column;
    min-height: 0;
    overflow: hidden;
  }

  .config-scroll {
    min-height: 0;
    padding: 18px 20px;
    overflow-y: auto;
  }

  .form-section + .form-section {
    margin-top: 22px;
    padding-top: 18px;
    border-top: 1px solid var(--border);
  }

  .form-section h2 {
    margin: 0 0 12px;
    color: var(--text);
    font-size: 14px;
    letter-spacing: 0;
  }

  .form-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 14px 16px;
  }

  .form-field {
    min-width: 0;
  }

  .form-field-wide {
    grid-column: 1 / -1;
  }

  .form-field label {
    display: block;
    margin-bottom: 5px;
    color: var(--text);
    font-size: 12px;
    font-weight: 700;
  }

  .form-field input,
  .form-field select {
    width: 100%;
    min-height: 38px;
    padding: 8px 10px;
    border: 1px solid var(--border);
    border-radius: 5px;
    background: var(--surface);
    color: var(--text);
    font: inherit;
  }

  .form-field input:focus,
  .form-field select:focus {
    border-color: var(--primary);
    outline: 2px solid var(--muted);
    outline-offset: 0;
  }

  .form-help {
    margin: 5px 0 0;
    color: var(--muted-text);
    font-size: 11px;
  }

  .config-form .result {
    margin: 0 0 12px;
  }

  .config-form .actions {
    gap: 10px;
    margin-top: 0;
  }

  .config-feedback {
    flex: 0 0 auto;
    padding: 12px 20px 16px;
    border-top: 1px solid var(--border);
    background: var(--surface);
  }

  .calendar-course {
    margin: 0 0 14px;
    color: var(--primary);
    font-size: 13px;
    font-weight: 700;
  }

  .section-heading {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
  }

  .section-heading h2,
  .section-heading h3 {
    margin: 0;
  }

  .compact-button {
    min-width: 0;
    padding: 7px 10px;
    font-size: 12px;
  }

  .calendar-type {
    border-top: 1px solid var(--border);
  }

  .calendar-type:last-child {
    border-bottom: 1px solid var(--border);
  }

  .calendar-type-toggle {
    display: flex;
    align-items: center;
    gap: 9px;
    padding: 12px 2px;
    cursor: pointer;
    font-weight: 700;
  }

  .calendar-type-toggle input {
    width: 18px;
    height: 18px;
    margin: 0;
    accent-color: var(--primary);
  }

  .calendar-type-details {
    padding: 2px 0 18px 29px;
  }

  .calendar-type-details.is-hidden {
    display: none;
  }

  .calendar-date-grid,
  .calendar-row,
  .calendar-event-grid {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 10px 12px;
  }

  .calendar-subsection {
    margin-top: 16px;
  }

  .calendar-subsection h3 {
    margin: 0 0 8px;
    font-size: 12px;
    letter-spacing: 0;
  }

  .calendar-list {
    display: grid;
    gap: 10px;
  }

  .calendar-row,
  .calendar-event {
    padding: 10px;
    border: 1px solid var(--border);
    border-radius: 6px;
    background: var(--background);
  }

  .evaluation-row {
    grid-template-columns: minmax(0, 1.4fr) minmax(145px, 0.8fr) 34px;
    align-items: end;
  }

  .calendar-event-grid {
    grid-template-columns: repeat(2, minmax(0, 1fr)) 34px;
    align-items: end;
  }

  .calendar-event-grid > .icon-action {
    grid-column: 3;
    grid-row: 1;
  }

  .calendar-field span {
    display: block;
    margin-bottom: 5px;
    font-size: 12px;
    font-weight: 700;
  }

  .calendar-field.wide {
    grid-column: 1 / 3;
  }

  .icon-action {
    display: grid;
    width: 34px;
    height: 38px;
    place-items: center;
    padding: 0;
    border: 1px solid var(--border);
    border-radius: 5px;
    background: var(--surface);
    color: var(--danger);
    cursor: pointer;
    font-size: 22px;
    line-height: 1;
  }

  .icon-action:hover,
  .icon-action:focus-visible {
    border-color: var(--danger);
    outline: 0;
  }

  .calendar-empty {
    margin: 0;
    padding: 10px 0;
    color: var(--muted-text);
    font-size: 12px;
  }

  .theme-colors {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 10px;
  }

  .color-field {
    display: flex;
    align-items: center;
    justify-content: space-between;
    min-height: 42px;
    padding: 6px 8px;
    border: 1px solid var(--border);
    border-radius: 5px;
    background: var(--background);
    color: var(--text);
    font-size: 12px;
    font-weight: 700;
  }

  .color-field input[type="color"] {
    width: 38px;
    min-height: 28px;
    padding: 2px;
    cursor: pointer;
  }

  .author-footer {
    padding: 10px 20px 14px;
    border-top: 1px solid var(--border);
    color: var(--muted-text);
    font-size: 11px;
    text-align: center;
  }

  .author-footer a {
    color: inherit;
  }

  .wizard {
    display: flex;
    flex: 1;
    min-height: 0;
    flex-direction: column;
    overflow: hidden;
  }

  .wizard-scroll {
    min-height: 0;
    flex: 1;
    padding: 18px 20px;
    overflow-y: auto;
  }

  .wizard-progress {
    margin: 0 0 14px;
    color: var(--primary);
    font-size: 13px;
    font-weight: 700;
  }

  .wizard-step.is-hidden {
    display: none;
  }

  .wizard-step h2 {
    margin: 0 0 8px;
    font-size: 18px;
    letter-spacing: 0;
  }

  .wizard-intro {
    margin: 0 0 18px;
    color: var(--muted-text);
  }

  .wizard-footer {
    flex: 0 0 auto;
    padding: 12px 20px 16px;
    border-top: 1px solid var(--border);
    background: var(--surface);
  }

  .wizard-footer .result {
    margin: 0 0 12px;
  }

  .wizard-footer .actions {
    gap: 10px;
    margin-top: 0;
  }

  .palette-preview {
    display: grid;
    height: 54px;
    grid-template-columns: repeat(3, 1fr);
    gap: 8px;
    margin-top: 18px;
  }

  .palette-preview span {
    border: 1px solid var(--border);
    border-radius: 5px;
  }

  .wizard-summary {
    margin: 0;
  }

  .wizard-summary div,
  .location-summary div {
    display: grid;
    grid-template-columns: minmax(120px, 0.8fr) minmax(0, 1.2fr);
    gap: 12px;
    padding: 9px 0;
    border-bottom: 1px solid var(--border);
  }

  .wizard-summary dt,
  .location-summary dt {
    color: var(--muted-text);
    font-size: 12px;
    font-weight: 700;
  }

  .wizard-summary dd,
  .location-summary dd {
    min-width: 0;
    margin: 0;
    overflow-wrap: anywhere;
  }

  .location-summary {
    margin: 0 0 18px;
  }

  .choose-folder-button {
    min-width: 150px;
  }

  .wizard-change-list {
    margin-top: 18px;
    color: var(--muted-text);
    font-size: 12px;
  }

  .wizard-change-list p {
    margin: 0 0 6px;
    color: var(--text);
    font-weight: 700;
  }

  .wizard-change-list ul {
    margin: 0;
    padding-left: 20px;
  }

  .folder-picker {
    position: fixed;
    z-index: 10;
    inset: 0;
    display: grid;
    place-items: center;
    padding: 20px;
    background: rgba(23, 32, 51, 0.42);
  }

  .folder-picker.is-hidden {
    display: none;
  }

  .folder-picker-dialog {
    display: flex;
    width: min(100%, 520px);
    max-height: calc(100vh - 40px);
    flex-direction: column;
    padding: 18px;
    border: 1px solid var(--border);
    border-radius: 6px;
    background: var(--surface);
    box-shadow: 0 12px 30px rgba(23, 32, 51, 0.2);
  }

  .folder-picker-dialog h2 {
    margin: 0 0 8px;
    font-size: 17px;
    letter-spacing: 0;
  }

  .folder-path {
    min-height: 20px;
    margin: 0 0 10px;
    color: var(--muted-text);
    font-size: 12px;
    overflow-wrap: anywhere;
  }

  .folder-toolbar {
    margin-bottom: 8px;
  }

  .folder-back-button {
    min-width: 96px;
  }

  .folder-list {
    min-height: 180px;
    max-height: 320px;
    overflow-y: auto;
    border-top: 1px solid var(--border);
    border-bottom: 1px solid var(--border);
  }

  .folder-row {
    display: block;
    width: 100%;
    padding: 10px 8px;
    border: 0;
    border-bottom: 1px solid var(--border);
    background: var(--surface);
    color: var(--text);
    cursor: pointer;
    font: inherit;
    text-align: left;
    overflow-wrap: anywhere;
  }

  .folder-row:hover,
  .folder-row:focus-visible {
    background: var(--muted);
    color: var(--primary);
    outline: 0;
  }

  .folder-empty {
    margin: 0;
    padding: 18px 8px;
    color: var(--muted-text);
    text-align: center;
  }

  .folder-picker-error {
    min-height: 20px;
    margin: 8px 0 0;
    color: var(--danger);
    font-size: 12px;
    font-weight: 700;
  }

  .folder-picker-dialog .actions {
    gap: 10px;
    margin-top: 10px;
  }

  .sidebar-app {
    width: 100%;
    min-width: 0;
  }

  .sidebar-brand-header {
    gap: 9px;
    padding: 12px 14px;
  }

  .sidebar-brand-logo {
    width: 34px;
    height: 42px;
  }

  .sidebar-brand-header .brand-name {
    font-size: 14px;
  }

  .icon-button {
    width: 34px;
    height: 34px;
    flex: 0 0 34px;
    padding: 0;
    border: 1px solid var(--border);
    border-radius: 5px;
    background: var(--background);
    color: var(--text);
    cursor: pointer;
    font-size: 20px;
    line-height: 1;
  }

  .icon-button:hover,
  .icon-button:focus-visible {
    border-color: var(--primary);
    color: var(--primary);
  }

  .icon-button:disabled {
    cursor: wait;
    opacity: 0.65;
  }

  .icon-button.is-refreshing {
    border-color: var(--primary);
    color: var(--primary);
  }

  .sidebar-content {
    flex: 1;
    min-width: 0;
    padding: 4px 14px 14px;
  }

  .sidebar-section {
    padding: 14px 0;
    border-bottom: 1px solid var(--border);
  }

  .sidebar-section:last-child {
    border-bottom: 0;
  }

  .sidebar-section h2 {
    margin: 0 0 10px;
    color: var(--text);
    font-size: 13px;
    letter-spacing: 0;
  }

  .sidebar-status {
    display: grid;
    gap: 8px;
  }

  .status-item {
    display: flex;
    min-width: 0;
    align-items: flex-start;
    gap: 9px;
  }

  .status-marker {
    display: grid;
    width: 21px;
    height: 21px;
    flex: 0 0 21px;
    place-items: center;
    border-radius: 50%;
    background: var(--muted);
    color: var(--muted-text);
    font-size: 13px;
    font-weight: 700;
  }

  .status-complete .status-marker {
    background: var(--success);
    color: var(--surface);
  }

  .status-pending .status-marker {
    background: var(--warning);
    color: var(--text);
  }

  .status-copy {
    min-width: 0;
  }

  .status-copy strong,
  .status-copy small {
    display: block;
    overflow-wrap: anywhere;
  }

  .status-copy strong {
    font-size: 12px;
  }

  .status-copy small {
    color: var(--muted-text);
    font-size: 11px;
  }

  .help-item {
    border-top: 1px solid var(--border);
  }

  .help-item:last-child {
    border-bottom: 1px solid var(--border);
  }

  .help-item summary {
    padding: 9px 2px;
    color: var(--text);
    cursor: pointer;
    font-size: 12px;
    font-weight: 700;
  }

  .help-item summary:focus-visible {
    outline: 2px solid var(--primary);
    outline-offset: 2px;
  }

  .help-item p {
    margin: 0;
    padding: 0 2px 10px 18px;
    color: var(--muted-text);
    font-size: 12px;
    overflow-wrap: anywhere;
  }

  .sidebar-footer {
    padding: 10px 12px 12px;
    overflow-wrap: anywhere;
  }

  @media (max-width: 520px) {
    .form-grid {
      grid-template-columns: 1fr;
    }

    .form-field-wide {
      grid-column: auto;
    }

    .theme-colors {
      grid-template-columns: 1fr;
    }

    .wizard-summary div,
    .location-summary div {
      grid-template-columns: 1fr;
      gap: 2px;
    }

    .calendar-type-details {
      padding-left: 0;
    }

    .calendar-date-grid,
    .evaluation-row,
    .calendar-event-grid {
      grid-template-columns: 1fr;
    }

    .calendar-field.wide {
      grid-column: auto;
    }

    .calendar-event-grid > .icon-action {
      grid-column: auto;
      grid-row: auto;
    }
  }
</style>
