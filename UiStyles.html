<style>
  :root {
    color-scheme: light;
    --ink: #172033;
    --muted: #64748b;
    --surface: #ffffff;
    --surface-soft: #f4f7fb;
    --border: #d8e0ea;
    --primary: #087ea4;
    --primary-dark: #075f7c;
    --success: #13795b;
    --success-soft: #e8f7f1;
    --error: #b42318;
    --error-soft: #fff0ee;
    --dev: #d95d0b;
  }

  * {
    box-sizing: border-box;
  }

  body {
    margin: 0;
    background: var(--surface);
    color: var(--ink);
    font-family: Arial, Helvetica, sans-serif;
    font-size: 14px;
    line-height: 1.45;
  }

  .app {
    display: flex;
    min-height: 100vh;
    flex-direction: column;
  }

  .brand-header {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 16px 20px;
    border-bottom: 1px solid var(--border);
  }

  .brand-logo {
    width: 42px;
    height: 52px;
    object-fit: contain;
  }

  .brand-copy {
    min-width: 0;
    flex: 1;
  }

  .brand-name {
    margin: 0;
    font-size: 16px;
    font-weight: 700;
  }

  .environment-badge {
    display: inline-block;
    margin-top: 3px;
    color: var(--dev);
    font-size: 11px;
    font-weight: 700;
    text-transform: uppercase;
  }

  .process {
    display: flex;
    flex: 1;
    flex-direction: column;
    padding: 20px;
  }

  .process-heading {
    display: grid;
    grid-template-columns: 76px minmax(0, 1fr);
    align-items: center;
    gap: 16px;
  }

  .splash-logo {
    width: 76px;
    height: 52px;
    border-radius: 6px;
    object-fit: cover;
  }

  h1 {
    margin: 0 0 4px;
    font-size: 20px;
    line-height: 1.25;
  }

  .status {
    margin: 0;
    color: var(--muted);
  }

  .activity {
    display: flex;
    align-items: center;
    gap: 12px;
    margin: 20px 0 12px;
  }

  .spinner {
    width: 22px;
    height: 22px;
    flex: 0 0 auto;
    border: 3px solid #cfe4ec;
    border-top-color: var(--primary);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }

  @keyframes spin {
    to { transform: rotate(360deg); }
  }

  .progress-track {
    overflow: hidden;
    height: 6px;
    margin-bottom: 16px;
    background: #e7edf3;
    border-radius: 3px;
  }

  .progress-bar {
    width: 0;
    height: 100%;
    background: var(--primary);
    transition: width 180ms ease;
  }

  .log {
    min-height: 128px;
    max-height: 150px;
    margin: 0;
    padding: 12px 12px 12px 30px;
    overflow: auto;
    border: 1px solid var(--border);
    background: var(--surface-soft);
    color: #3f4d61;
    font-size: 13px;
  }

  .log li + li {
    margin-top: 5px;
  }

  .log .error-entry {
    color: var(--error);
    font-weight: 700;
  }

  .result {
    display: none;
    margin-top: 16px;
    padding: 12px;
    border: 1px solid transparent;
    border-radius: 6px;
  }

  .result.visible {
    display: block;
  }

  .result.success {
    border-color: #abdcca;
    background: var(--success-soft);
    color: var(--success);
  }

  .result.error {
    border-color: #f3b7b1;
    background: var(--error-soft);
    color: var(--error);
  }

  .actions {
    display: flex;
    justify-content: flex-end;
    min-height: 38px;
    margin-top: 16px;
  }

  .button {
    display: none;
    min-width: 96px;
    padding: 9px 16px;
    border: 0;
    border-radius: 5px;
    background: var(--primary);
    color: #ffffff;
    cursor: pointer;
    font: inherit;
    font-weight: 700;
  }

  .button.visible {
    display: inline-block;
  }

  .button:hover,
  .button:focus-visible {
    background: var(--primary-dark);
  }

  .author-footer {
    padding: 10px 20px 14px;
    border-top: 1px solid var(--border);
    color: var(--muted);
    font-size: 11px;
    text-align: center;
  }

  .author-footer a {
    color: inherit;
  }
</style>
