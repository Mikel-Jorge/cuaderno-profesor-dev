<!DOCTYPE html>
<html lang="es">
  <head>
    <base target="_top">
    <meta charset="utf-8">
    <style><?!= uiThemeCss ?></style>
    <?!= includeUiFile_('UiStyles'); ?>
  </head>
  <body>
    <main class="app">
      <header class="brand-header">
        <img class="brand-logo" src="<?!= branding.icon ?>" alt="">
        <div class="brand-copy">
          <p class="brand-name"><?= uiConfig.projectName ?></p>
          <span class="version-label"><?= uiConfig.versionLabel ?></span>
        </div>
      </header>

      <form class="config-form" id="config-form">
        <div class="config-scroll">
          <section class="form-section" aria-labelledby="teacher-section-title">
            <h2 id="teacher-section-title">Informaci&oacute;n docente</h2>
            <div class="form-grid">
              <div class="form-field">
                <label for="curso_academico">Curso acad&eacute;mico</label>
                <input id="curso_academico" name="curso_academico" type="text" inputmode="numeric" autocomplete="off">
                <p class="form-help">Formato YYYY-YYYY</p>
              </div>

              <div class="form-field">
                <label for="profesor">Nombre y apellidos del profesor</label>
                <input id="profesor" name="profesor" type="text" autocomplete="name">
              </div>

              <div class="form-field form-field-wide">
                <label for="profesor_email">Correo del profesor</label>
                <input id="profesor_email" name="profesor_email" type="email" autocomplete="email">
              </div>
            </div>
          </section>

          <section class="form-section" aria-labelledby="school-section-title">
            <h2 id="school-section-title">Centro educativo</h2>
            <div class="form-grid">
              <div class="form-field form-field-wide">
                <label for="centro">Nombre del centro</label>
                <input id="centro" name="centro" type="text" autocomplete="organization">
              </div>

              <div class="form-field form-field-wide">
                <label for="centro_direccion">Direcci&oacute;n</label>
                <input id="centro_direccion" name="centro_direccion" type="text" autocomplete="street-address">
              </div>

              <div class="form-field">
                <label for="centro_telefono">Tel&eacute;fono</label>
                <input id="centro_telefono" name="centro_telefono" type="tel" autocomplete="tel">
              </div>

              <div class="form-field">
                <label for="centro_email">Correo del centro</label>
                <input id="centro_email" name="centro_email" type="email">
              </div>

              <div class="form-field form-field-wide">
                <label for="centro_web">Web del centro</label>
                <input id="centro_web" name="centro_web" type="text" inputmode="url" autocomplete="url">
              </div>
            </div>
          </section>

        </div>
        <div class="save-loading is-hidden" id="save-loading" role="status" aria-live="polite"><span class="loading-spinner" aria-hidden="true"></span><span>Guardando datos...</span></div>

        <div class="config-feedback">
          <div class="result" id="form-result" role="status"></div>
          <div class="actions">
            <button class="button button-secondary" id="close-button" type="button">Cancelar</button>
            <button class="button" id="save-button" type="submit" disabled>Guardar</button>
          </div>
        </div>
      </form>

      <footer class="author-footer">
        &copy; <?= uiConfig.author ?> &middot;
        <a href="mailto:<?= uiConfig.authorEmail ?>"><?= uiConfig.authorEmail ?></a>
      </footer>
    </main>

    <script>
      const GENERAL_CONFIG = <?!= JSON.stringify(generalConfig) ?>;
      const BLOCKING_ERROR = <?!= JSON.stringify(blockingError || '') ?>;
      const fieldNames = [
        'curso_academico',
        'profesor',
        'profesor_email',
        'centro',
        'centro_direccion',
        'centro_telefono',
        'centro_email',
        'centro_web',
      ];
      const form = document.getElementById('config-form');
      const closeButton = document.getElementById('close-button');
      const saveButton = document.getElementById('save-button');
      const resultElement = document.getElementById('form-result');
      const saveLoading = document.getElementById('save-loading');
      let baseline = '';
      let isSaving = false;

      setFormValues(GENERAL_CONFIG);
      baseline = serializeValues(collectValues());
      updateSaveButton();
      if (BLOCKING_ERROR) {
        showResult(BLOCKING_ERROR, 'error');
        form.querySelectorAll('input, select, button').forEach(function(control) {
          if (control !== closeButton) control.disabled = true;
        });
      }

      form.addEventListener('input', handleFormChange);
      form.addEventListener('change', handleFormChange);

      form.addEventListener('submit', function(event) {
        event.preventDefault();
        if (isSaving || !isDirty()) {
          return;
        }

        const values = collectValues();
        const academicYearMatch = /^(\d{4})-(\d{4})$/.exec(values.curso_academico);
        if (!academicYearMatch || Number(academicYearMatch[2]) !== Number(academicYearMatch[1]) + 1) {
          showResult('El curso académico debe tener el formato YYYY-YYYY.', 'error');
          return;
        }

        setSavingState(true);
        hideResult();
        google.script.run
          .withSuccessHandler(handleSaveSuccess)
          .withFailureHandler(handleSaveError)
          .guardarDatosGenerales(values);
      });

      closeButton.addEventListener('click', function() {
        google.script.host.close();
      });

      function handleFormChange(event) {
        if (isSaving) return;
        if (resultElement.classList.contains('success')) {
          hideResult();
        }
        updateSaveButton();
      }

      function handleSaveSuccess(response) {
        if (response && response.values) {
          setFormValues(response.values);
        }
        google.script.host.close();
      }

      function handleSaveError(error) {
        const message = error && error.message ? error.message : 'No se ha podido guardar la configuración.';
        setSavingState(false);
        showResult(message, 'error');
        updateSaveButton();
      }

      function setFormValues(values) {
        fieldNames.forEach(function(fieldName) {
          document.getElementById(fieldName).value = values[fieldName] || '';
        });
      }

      function collectValues() {
        return fieldNames.reduce(function(config, fieldName) {
          config[fieldName] = document.getElementById(fieldName).value.trim();
          return config;
        }, {});
      }

      function serializeValues(values) {
        return JSON.stringify(values);
      }

      function isDirty() {
        return serializeValues(collectValues()) !== baseline;
      }

      function updateSaveButton() {
        saveButton.disabled = isSaving || !isDirty();
      }

      function setSavingState(saving) {
        isSaving = saving;
        closeButton.disabled = saving;
        saveButton.disabled = saving;
        saveButton.textContent = saving ? 'Guardando...' : 'Guardar';
        form.querySelector('.config-scroll').classList.toggle('is-hidden', saving);
        saveLoading.classList.toggle('is-hidden', !saving);
        updateSaveButton();
      }

      function showResult(message, state) {
        resultElement.textContent = message;
        resultElement.className = 'result visible ' + state;
      }

      function hideResult() {
        resultElement.textContent = '';
        resultElement.className = 'result';
      }
    </script>
  </body>
</html>
