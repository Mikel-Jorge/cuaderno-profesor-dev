<!DOCTYPE html><html lang="es"><head><base target="_top"><meta charset="utf-8"><style><?!= uiThemeCss ?></style><?!= includeUiFile_('UiStyles'); ?>
<style>.repair-app{padding:14px}.repair-app .brand-header{padding:0 0 8px}.repair-app .brand-logo{width:28px;height:36px}.repair-app h2{margin:8px 0;font-size:17px}.repair-intro{margin:5px 0;font-size:13px}.repair-note{margin:0;color:var(--muted-text);font-size:12px}.repair-grid{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin:12px 0}.repair-group{margin:0 0 7px;color:var(--muted-text);font-size:11px;font-weight:700;letter-spacing:.06em}.repair-list{display:grid;gap:9px}.repair-list label{display:flex;align-items:center;gap:8px;font-size:13px}.repair-list input{width:17px;height:17px}.repair-actions{display:flex;gap:5px;align-items:center}.repair-actions button{border:0;background:transparent;padding:2px;color:var(--primary);cursor:pointer;font-size:12px;text-decoration:underline}.repair-actions button:focus-visible{outline:2px solid var(--accent)}.repair-app .actions{margin-top:9px}.repair-app .author-footer{margin-top:8px;padding:5px}#repair{min-width:115px;min-height:38px;display:inline-flex;align-items:center;justify-content:center;gap:6px;border-radius:6px;white-space:nowrap}#repair .loading-spinner{width:14px;height:14px;flex:0 0 14px;border-width:2px}</style></head><body>
<main class="app repair-app"><header class="brand-header"><img class="brand-logo" src="<?!= branding.icon ?>" alt=""><div class="brand-copy"><p class="brand-name"><?= uiConfig.projectName ?></p><span class="version-label"><?= uiConfig.versionLabel ?></span></div></header>
<h2>Reparar estructura</h2><p class="repair-intro">Selecciona qué quieres reparar.</p><p class="repair-note">Tus datos se conservarán.</p>
<div class="repair-grid"><div><p class="repair-group">GENERAL</p><div class="repair-list"><label><input type="checkbox" data-key="cover" checked> Portada</label><label><input type="checkbox" data-key="calendar" checked> Calendario</label><label><input type="checkbox" data-key="schedule" checked> Horario</label><label><input type="checkbox" data-key="students" checked> Alumnado</label></div></div><div><p class="repair-group">MÓDULOS</p><div class="repair-list"><label><input type="checkbox" data-key="config" checked> 4 Config</label><label><input type="checkbox" data-key="tracking" checked> 5 Seg</label><label><input type="checkbox" data-key="evaluation" checked> 6 Eval</label></div></div></div>
<div class="repair-actions"><button type="button" id="all">Seleccionar todo</button><span>·</span><button type="button" id="none">Ninguno</button></div><p id="technical-only" class="form-help" hidden>Se realizará únicamente mantenimiento general.</p><p id="error" class="confirmation-error" role="alert"></p><div class="actions"><button class="button button-secondary" type="button" id="cancel">Cancelar</button><button class="button" type="button" id="repair">Reparar</button></div><footer class="author-footer">&copy; <?= uiConfig.author ?></footer></main>
<script>const boxes=Array.from(document.querySelectorAll('[data-key]')),repair=document.getElementById('repair');function updateHint(){document.getElementById('technical-only').hidden=boxes.some(function(box){return box.checked})}boxes.forEach(function(box){box.addEventListener('change',updateHint)});document.getElementById('all').addEventListener('click',function(){boxes.forEach(function(box){box.checked=true});updateHint()});document.getElementById('none').addEventListener('click',function(){boxes.forEach(function(box){box.checked=false});updateHint()});document.getElementById('cancel').addEventListener('click',function(){google.script.host.close()});repair.addEventListener('click',function(){const selection={};boxes.forEach(function(box){selection[box.dataset.key]=box.checked});document.querySelectorAll('button,input').forEach(function(control){control.disabled=true});repair.innerHTML='<span class="loading-spinner" aria-hidden="true"></span><span>Reparando…</span>';google.script.run.withFailureHandler(function(error){document.getElementById('error').textContent=error.message||String(error);document.querySelectorAll('button,input').forEach(function(control){control.disabled=false});repair.textContent='Reparar'}).iniciarReparacionSeleccionada(selection)})</script></body></html>
