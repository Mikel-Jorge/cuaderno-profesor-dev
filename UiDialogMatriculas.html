<!DOCTYPE html><html lang="es"><head><base target="_top"><meta charset="utf-8"><style><?!= uiThemeCss ?></style><?!= includeUiFile_('UiStyles'); ?><style>
html,body{height:100%;margin:0;overflow:hidden}.enrollment-app{display:flex;flex-direction:column;height:100%;color:var(--text);background:var(--surface)}.enrollment-body{flex:1;min-height:0;overflow-y:auto;padding:16px 20px}.enrollment-body h1{font-size:20px;margin:0 0 5px}.enrollment-body p{line-height:1.45}.enrollment-body select{width:100%;height:40px;padding:7px;border:1px solid var(--border);border-radius:6px;background:var(--surface);color:var(--text)}.enrollment-body label{font-weight:600}.enrollment-note{padding:10px 12px;border:1px solid var(--border);border-left:4px solid var(--accent);border-radius:7px;background:var(--muted);margin:15px 0;font-size:13px}.enrollment-toolbar{display:flex;gap:8px;margin:12px 0}.enrollment-toolbar[hidden]{display:none}.enrollment-toolbar button{border:0;background:transparent;color:var(--primary);cursor:pointer;text-decoration:underline}.enrollment-list{display:grid;gap:3px}.enrollment-empty{padding:12px;border:1px solid var(--warning);border-left-width:4px;border-radius:7px;background:color-mix(in srgb,var(--warning) 12%,var(--surface));font-size:13px}.enrollment-empty strong{display:block;margin-bottom:5px}.enrollment-empty span{display:block}.enrollment-row{display:flex;align-items:center;gap:9px;min-height:39px;padding:5px 8px;border-bottom:1px solid var(--border);font-weight:400!important;cursor:pointer}.enrollment-row input{width:17px;height:17px;flex:none}.enrollment-footer{display:flex;align-items:center;gap:10px;flex:none;padding:12px 20px;border-top:1px solid var(--border)}.enrollment-footer small{margin-right:auto;color:var(--muted-text)}.enrollment-error{color:var(--danger);font-size:13px;padding:0 20px 7px}.enrollment-error:empty{display:none}.enrollment-loading{position:absolute;inset:60px 0 60px;display:grid;place-content:center;justify-items:center;gap:10px;background:var(--surface)}.enrollment-loading[hidden]{display:none}
</style></head><body><main class="enrollment-app"><header class="brand-header"><img class="brand-logo" src="<?!= branding.icon ?>" alt=""><div class="brand-copy"><p class="brand-name"><?= uiConfig.projectName ?></p><span class="version-label"><?= uiConfig.versionLabel ?></span></div></header><div class="enrollment-body"><h1>Matrículas de módulos</h1><p>Grupo indica el grupo general; aquí eliges los módulos concretos que cursa cada alumno.</p><label for="module">Módulo</label><select id="module"></select><p class="enrollment-note" id="mode-note" hidden></p><div class="enrollment-toolbar" id="selection-tools"><button type="button" id="select-all">Seleccionar todo</button><button type="button" id="select-none">Ninguno</button></div><div class="enrollment-list" id="students"></div></div><div class="enrollment-loading" id="loading" role="status" hidden><span class="spinner" aria-hidden="true"></span><strong id="loading-label">Cargando…</strong></div><div class="enrollment-error" id="error" role="alert"></div><footer class="enrollment-footer"><small>© <?= uiConfig.author ?></small><button class="button button-secondary" type="button" id="close">Cerrar</button><button class="button" type="button" id="save">Guardar matrículas</button></footer></main>
<script>
const moduleSelect=document.getElementById('module'),list=document.getElementById('students'),save=document.getElementById('save'),error=document.getElementById('error');let data=null,busy=false;
function setBusy(value,label){busy=value;document.getElementById('loading').hidden=!value;document.getElementById('loading-label').textContent=label;save.disabled=value;moduleSelect.disabled=value}
function render(){const selected=moduleSelect.value;moduleSelect.replaceChildren();(data.modules||[]).forEach(function(module){const option=document.createElement('option');option.value=module.id;option.textContent=module.acronym+' · '+module.group+' — '+module.name;moduleSelect.appendChild(option)});if(data.modules.some(function(module){return module.id===selected}))moduleSelect.value=selected;renderStudents()}
function renderStudents(){list.replaceChildren();const module=data.modules.find(function(item){return item.id===moduleSelect.value}),note=document.getElementById('mode-note'),tools=document.getElementById('selection-tools');if(!module){note.hidden=false;note.textContent='Primero configura tus módulos en Configuración → Horario → Actividades.';tools.hidden=true;save.disabled=true;return}const candidateRows=new Set(data.candidatesByModule[module.id]||[]),candidates=data.students.filter(function(student){return candidateRows.has(student.rowNumber)}).sort(function(a,b){return a.surname.localeCompare(b.surname,'es',{sensitivity:'base'})||a.name.localeCompare(b.name,'es',{sensitivity:'base'})});tools.hidden=!candidates.length;if(!candidates.length){note.hidden=true;const empty=document.createElement('div'),title=document.createElement('strong'),detail=document.createElement('span');empty.className='enrollment-empty';empty.setAttribute('role','status');title.textContent='⚠ No hay alumnado disponible para este módulo';detail.textContent='No hay alumnado en 3 Alumnado que coincida con este módulo. Puedes importarlo desde EDUCA.';empty.append(title,detail);list.appendChild(empty);save.disabled=true;return}const explicit=Boolean(data.modes[module.id]);note.hidden=false;note.textContent=explicit?'Este módulo ya tiene el alumnado matriculado de forma individual. Marca o desmarca alumnado y guarda para actualizar quién cursa este módulo.':'Actualmente este módulo incluye a todo el alumnado del grupo «'+module.group+'». Si guardas esta pantalla, quedará registrada la selección de alumnado que cursa este módulo.';const selected={};data.enrollments.forEach(function(row){if(row.activityId===module.id)selected[row.studentId]=row.active});candidates.forEach(function(student){const label=document.createElement('label'),checkbox=document.createElement('input'),caption=document.createElement('span');label.className='enrollment-row';checkbox.type='checkbox';checkbox.value=student.id;checkbox.checked=explicit?selected[student.id]===true:true;checkbox.disabled=!student.id;caption.textContent=student.surname+', '+student.name+(student.id?'':' · Repara Alumnado para asignar ID');label.append(checkbox,caption);list.appendChild(label)});save.disabled=candidates.some(function(student){return !student.id})}
function load(){setBusy(true,'Cargando matrículas…');google.script.run.withSuccessHandler(function(result){data=result;setBusy(false,'');render()}).withFailureHandler(function(failure){setBusy(false,'');error.textContent=failure.message||'No se han podido leer las matrículas.'}).obtenerDatosMatriculasModulos()}
moduleSelect.addEventListener('change',renderStudents);document.getElementById('select-all').addEventListener('click',function(){list.querySelectorAll('input:not(:disabled)').forEach(function(input){input.checked=true})});document.getElementById('select-none').addEventListener('click',function(){list.querySelectorAll('input:not(:disabled)').forEach(function(input){input.checked=false})});document.getElementById('close').addEventListener('click',function(){google.script.host.close()});save.addEventListener('click',function(){if(busy||!moduleSelect.value)return;error.textContent='';const selection=Array.from(list.querySelectorAll('input:checked')).map(function(input){return input.value});setBusy(true,'Guardando matrículas…');google.script.run.withSuccessHandler(function(){google.script.host.close()}).withFailureHandler(function(failure){setBusy(false,'');error.textContent=failure.message||'No se han podido guardar las matrículas.'}).saveModuleEnrollments({activityId:moduleSelect.value,studentIds:selection})});load();
</script></body></html>
